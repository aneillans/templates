services:
  mvc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Authentication__Oidc__Authority=http://keycloak:8080/realms/template-realm
      - Authentication__Oidc__ClientId=mvc-host
      - Authentication__Oidc__ClientSecret=mvc-host-secret
      - Authentication__Oidc__RequireHttpsMetadata=false
    depends_on:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    # Imports ./keycloak/template-realm-realm.json (clients, roles, demo users) on first start.
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8082:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Tokens are issued for the browser-facing URL; containers still reach keycloak:8080.
      - KC_HOSTNAME=http://localhost:8082
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
