# Serves the built SPA. When API_UPSTREAM is set, /api/ is also proxied to the API (prefix
# stripped), so the browser stays same-origin and the API needs no CORS. The snippet is generated
# at startup by 40-deployment-config.sh.

# Behind oauth2-proxy (--pass-access-token) the token arrives in X-Forwarded-Access-Token; turn it
# into the bearer header the API validates. Without it, whatever Authorization the client sent is kept.
map $http_x_forwarded_access_token $api_authorization {
    ""      $http_authorization;
    default "Bearer $http_x_forwarded_access_token";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Generated /api/ location: a proxy to API_UPSTREAM, or a 503 when it isn't set.
    include /etc/nginx/snippets/*.conf;

    # Fingerprinted build output can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell and runtime config must never be cached, so deploys and config changes apply.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /deployment-config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Translations keep their names across releases, so revalidate them on every load.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (deep links) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
