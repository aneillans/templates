name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dotnet-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TemplateKit.sln

      - name: Build
        run: dotnet build TemplateKit.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/Aneillans.TemplateKit.Auth.Tests/Aneillans.TemplateKit.Auth.Tests.csproj -c Release --no-build
          dotnet test tests/Aneillans.TemplateKit.Data.Tests/Aneillans.TemplateKit.Data.Tests.csproj -c Release --no-build

      - name: Pack templates
        run: |
          dotnet pack templates/aneillans-api/aneillans-api.TemplatePack.csproj -c Release -o artifacts
          dotnet pack templates/aneillans-mvc/aneillans-mvc.TemplatePack.csproj -c Release -o artifacts
          dotnet pack templates/aneillans-angular/aneillans-angular.TemplatePack.csproj -c Release -o artifacts
          
  angular-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/aneillans-angular/content/angular-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/aneillans-angular/content/angular-app/package.json

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
