name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dotnet-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TemplateKit.sln

      - name: Build
        run: dotnet build TemplateKit.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/Neillans.TemplateKit.Auth.Tests/Neillans.TemplateKit.Auth.Tests.csproj -c Release --no-build
          dotnet test tests/Neillans.TemplateKit.Data.Tests/Neillans.TemplateKit.Data.Tests.csproj -c Release --no-build

      - name: Pack templates
        run: |
          dotnet pack templates/neillans-api/neillans-api.TemplatePack.csproj -c Release -o artifacts
          dotnet pack templates/neillans-mvc/neillans-mvc.TemplatePack.csproj -c Release -o artifacts
          dotnet pack templates/neillans-angular/neillans-angular.TemplatePack.csproj -c Release -o artifacts
          
  angular-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/neillans-angular/content/angular-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/neillans-angular/content/angular-app/package.json

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

  examples-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/angular-demo/content/demo-angular/package-lock.json

      - name: Validate API demo
        run: |
          dotnet restore examples/api-demo/content/DemoApi.sln
          dotnet build examples/api-demo/content/DemoApi.sln -c Release --no-restore
          dotnet test examples/api-demo/content/tests/DemoApi.Tests/DemoApi.Tests.csproj -c Release --no-build

      - name: Validate MVC demo
        run: |
          dotnet restore examples/mvc-demo/content/DemoMvc.sln
          dotnet build examples/mvc-demo/content/DemoMvc.sln -c Release --no-restore
          dotnet test examples/mvc-demo/content/tests/DemoMvc.Tests/DemoMvc.Tests.csproj -c Release --no-build

      - name: Validate Angular demo
        run: |
          npm --prefix examples/angular-demo/content/demo-angular install
          npm --prefix examples/angular-demo/content/demo-angular run build
          npm --prefix examples/angular-demo/content/demo-angular test
