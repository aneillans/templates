services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Data Source=/app/app.db
      - Database__Provider=Sqlite
      - Authentication__Jwt__Authority=http://keycloak:8080/realms/template-realm
      - Authentication__Jwt__Audience=api-host
      - Authentication__Jwt__RequireHttpsMetadata=false
    depends_on:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8081:8080"
