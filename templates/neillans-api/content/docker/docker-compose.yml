services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=apihost;Username=postgres;Password=postgres
      - Database__Provider=PostgreSql
      - Authentication__Jwt__Authority=http://keycloak:8080/realms/template-realm
      - Authentication__Jwt__Audience=api-host
      - Authentication__Jwt__RequireHttpsMetadata=false
    depends_on:
      - postgres
      - keycloak

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=apihost
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    # Imports ./keycloak/template-realm-realm.json (clients, roles, demo users) on first start.
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Tokens are issued for the browser-facing URL; containers still reach keycloak:8080.
      - KC_HOSTNAME=http://localhost:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "8081:8080"
