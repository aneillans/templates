services:
  mvc:
    build:
      context: ../../templates/neillans-mvc/content
      dockerfile: docker/Dockerfile
    ports:
      - "8090:8080"
    environment:
      - Authentication__Oidc__Authority=http://keycloak:8080/realms/template-realm
      - Authentication__Oidc__ClientId=mvc-host
      - Authentication__Oidc__ClientSecret=mvc-host-secret
      - Authentication__Oidc__RequireHttpsMetadata=false
    depends_on:
      - keycloak

  api:
    build:
      context: ../../templates/neillans-api/content
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Database__Provider=PostgreSql
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=fullstack;Username=postgres;Password=postgres
      - Authentication__Jwt__Authority=http://keycloak:8080/realms/template-realm
      - Authentication__Jwt__Audience=api-host
      - Authentication__Jwt__RequireHttpsMetadata=false
    depends_on:
      - postgres
      - keycloak

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=fullstack
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    # Imports ./keycloak/template-realm-realm.json (clients, roles, demo users) on first start.
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Tokens are issued for the browser-facing URL; containers still reach keycloak:8080.
      - KC_HOSTNAME=http://localhost:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "8081:8080"

  spa:
    build:
      context: ../../templates/neillans-angular/content/angular-app
      dockerfile: docker/Dockerfile
    ports:
      - "4200:80"
    environment:
      # Built from the raw template content, which is the default --auth oidc model.
      - OIDC_AUTHORITY=http://localhost:8081/realms/template-realm
      - OIDC_CLIENT_ID=angular-spa
      # Same-origin /api/ proxied to the API, so no CORS is needed.
      - API_UPSTREAM=http://api:8080
    depends_on:
      - api
      - keycloak
